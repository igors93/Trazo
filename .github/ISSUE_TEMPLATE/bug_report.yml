name: Bug report
description: Something in Trazo does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search the [existing issues](https://github.com/igors93/Trazo/issues) first.
        **Security problems must not be reported here.** See [SECURITY.md](https://github.com/igors93/Trazo/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: After moving the wall between the kitchen and the living room, the door on that wall disappeared.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a 4 × 3 m room with Cômodo (C)
        2. Add a door to the right wall
        3. Drag the right wall 0.5 m to the right
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or project file
      description: Drag images here. A small `.json` project that shows the problem is the most useful thing you can attach.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drawing and editing
        - Doors, windows and walls
        - Interiors and library
        - Dimensions, sheets and export
        - Files, saving and recovery
        - AI assistants (MCP)
        - Interface and performance
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trazo version or commit
      placeholder: "main @ 1d4fb0e"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
