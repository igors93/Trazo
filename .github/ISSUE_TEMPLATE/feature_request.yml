name: Feature request
description: Suggest an idea or an improvement for Trazo.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/igors93/Trazo/blob/main/ROADMAP.md) first: your idea may already be planned, and you can mention its number (for example #38).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where Trazo falls short. Trazo is built for families who build their own home without an engineer, so stories from real building sites are especially welcome. Portuguese is fine.
      placeholder: Vamos subir um andar em cima da casa da minha mãe e ninguém sabe como foi feita a fundação. O Trazo calculou como se a fundação aguentasse.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      placeholder: Ask how the existing house was built before sizing a new floor on top, and stop with a clear warning when nobody knows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: input
    id: roadmap
    attributes:
      label: Related roadmap item
      placeholder: "#38"
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      options:
        - Families building their own home
        - Bricklayers, site foremen and community groups
        - Professionals giving technical assistance to families
        - AI assistant users
        - Everyone
