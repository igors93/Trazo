version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # skrifa checks system fonts with the same parser egui uses, so it is
      # updated together with eframe/egui, never on its own.
      - dependency-name: "skrifa"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
