[package]
name = "trazo"
version = "0.1.0"
edition = "2024"
description = "A simple, approachable floor plan editor"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.50"
svg2pdf = "0.13"

[profile.release]
strip = true
lto = "thin"

