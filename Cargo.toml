[package]
name = "trazo"
version = "0.1.0"
edition = "2024"
description = "A native 2D architectural CAD for floor plans, with a built-in MCP server for AI assistants"
license = "MIT OR Apache-2.0"
repository = "https://github.com/igors93/Trazo"
readme = "README.md"
keywords = ["cad", "floor-plan", "architecture", "egui", "mcp"]
categories = ["graphics", "gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# A small blocking HTTP server for the MCP endpoint (no async runtime).
tiny_http = "0.12"
resvg = "0.50"
# The font parser egui uses, to check a system font before handing it over.
skrifa = { version = "0.49", default-features = false, features = ["std"] }
svg2pdf = "0.13"

[dev-dependencies]
proptest = "1"

[profile.release]
strip = true
lto = "thin"

