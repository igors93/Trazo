[package]
name = "trazo"
version = "0.1.0"
edition = "2024"
description = "A native 2D architectural CAD for floor plans, with a built-in MCP server for AI assistants"
license = "MIT OR Apache-2.0"
repository = "https://github.com/igors93/Trazo"
readme = "README.md"
keywords = ["cad", "floor-plan", "architecture", "egui", "mcp"]
categories = ["graphics", "gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.18"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23"
getrandom = "0.3"
cap = "0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
flate2 = "1"
rayon = "1.12"
# A small blocking HTTP server for the MCP endpoint (no async runtime).
tiny_http = "0.12"
resvg = "0.50"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# The font parser egui uses, to check a system font before handing it over.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
svg2pdf = "0.13"
# Several SVG pages in one PDF (the pre-sizing report); the version svg2pdf uses.
pdf-writer = "0.12"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# Keep heavy rasterisation/PDF/image dependencies fast even in debug builds and tests.
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.svg2pdf]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.pdf-writer]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.release]
strip = true
lto = "thin"

